media:
  input: assets
  output: /assets

content:
  - name: products
    label: 🩱 Produtos
    type: file
    path: data/products.json
    format: json
    fields:
      - name: products
        label: Catálogo de biquínis
        type: object
        list: true
        fields:
          - name: name
            label: Nome do biquíni
            type: string
            required: true

          - name: id
            label: Código do produto
            type: string
            required: true

          - name: active
            label: Mostrar produto na loja
            type: boolean
            default: true

          - name: price
            label: Preço
            type: number
            required: true
            default: 199.9

          - name: color
            label: Cor
            type: string

          - name: description
            label: Descrição
            type: text

          - name: sizes
            label: Tamanhos disponíveis
            type: select
            list: true
            options:
              values:
                - P
                - M
                - G
                - GG

          - name: images
            label: Fotos do produto
            type: image
            list: true

  - name: site
    label: ⚙️ Página da Loja
    type: file
    path: data/site.json
    format: json
    fields:
      - name: whatsappNumber
        label: WhatsApp
        type: string

      - name: instagramUrl
        label: Instagram
        type: string

      - name: hero
        label: 🏖️ Capa da Loja
        type: object
        fields:
          - name: eyebrow
            label: Texto superior
            type: string
          - name: title
            label: Título
            type: string
          - name: text
            label: Texto
            type: text
          - name: button
            label: Texto do botão
            type: string
          - name: images
            label: Imagens da capa
            type: image
            list: true

      - name: collection
        label: 🩱 Coleção
        type: object
        fields:
          - name: eyebrow
            label: Texto superior
            type: string
          - name: title
            label: Título
            type: string
          - name: text
            label: Descrição
            type: text

      - name: exclusive
        label: ⭐ Modelos Exclusivos
        type: object
        fields:
          - name: eyebrow
            label: Texto superior
            type: string

          - name: title
            label: Título
            type: string

          - name: text
            label: Descrição da seção
            type: text

          - name: button
            label: Texto do botão
            type: string

          - name: cover
            label: Imagem principal dos exclusivos
            type: image

          - name: models
            label: Modelos exclusivos
            type: object
            list: true
            fields:
              - name: name
                label: Nome do modelo
                type: string
                required: true

              - name: description
                label: Descrição
                type: text

              - name: image
                label: Imagem
                type: image

              - name: active
                label: Mostrar no site
                type: boolean
                default: true

      - name: benefits
        label: ✨ Detalhes que fazem diferença
        type: object
        fields:
          - name: eyebrow
            label: Texto superior
            type: string
          - name: title
            label: Título
            type: string
          - name: items
            label: Itens
            type: object
            list: true
            fields:
              - name: title
                label: Título
                type: string
              - name: text
                label: Texto
                type: text

      - name: about
        label: ❤️ A Marca
        type: object
        fields:
          - name: eyebrow
            label: Texto superior
            type: string
          - name: title
            label: Título
            type: string
          - name: text1
            label: Primeiro texto
            type: text
          - name: text2
            label: Segundo texto
            type: text
          - name: image
            label: Imagem
            type: image

      - name: contact
        label: 💬 Atendimento
        type: object
        fields:
          - name: eyebrow
            label: Texto superior
            type: string
          - name: title
            label: Título
            type: string
          - name: text
            label: Texto
            type: text
